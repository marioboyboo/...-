<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeerJS Audio Streamer</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    body.mic-active { background-color: #000000; }
    .container {
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    button {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 5px;
    }
    input {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: white;
      text-align: center;
      font-size: 1rem;
    }
    .hidden { display: none !important; }
    .code-display {
      font-size: 1.8rem;
      font-weight: bold;
      color: #34c759;
      letter-spacing: 2px;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <div id="selection-view" class="container">
    <h2>Select Role</h2>
    <button onclick="startMic()">Mic (Transmitter)</button>
    <button onclick="startListener()">Listener (Receiver)</button>
  </div>

  <div id="mic-view" class="container hidden">
    <h3>Microphone Active</h3>
    <p>Your unique Mic Code is:</p>
    <div id="mic-id-display" class="code-display">Generating...</div>
    <p style="font-size: 0.8rem; color: #8e8e93;">Screen will go black shortly...</p>
  </div>

  <div id="listener-view" class="container hidden">
    <h2>Listener Mode</h2>
    <p>Enter the 4-digit code shown on the Mic device:</p>
    <input type="text" id="target-id" placeholder="e.g. 4821" maxlength="4">
    <br>
    <button onclick="connectToMic()">Connect & Listen</button>
    <div id="status" style="margin-top: 15px; color: #8e8e93;">Not connected</div>
    <audio id="audio-player" autoplay controls style="width: 100%; margin-top: 15px;"></audio>
  </div>

  <script>
    let peer = null;
    let localStream = null;

    function startMic() {
      document.getElementById('selection-view').classList.add('hidden');
      document.getElementById('mic-view').classList.remove('hidden');

      // Random 4-digit ID prefix for easy typing
      const customId = 'mic-' + Math.floor(1000 + Math.random() * 9000);
      
      // Initialize PeerJS
      peer = new Peer(customId);

      peer.on('open', (id) => {
        document.getElementById('mic-id-display').textContent = id.replace('mic-', '');
        
        // Darken screen after 3 seconds
        setTimeout(() => {
          document.body.classList.add('mic-active');
          document.getElementById('mic-view').classList.add('hidden');
        }, 3000);
      });

      // Capture Microphone Audio
      navigator.mediaDevices.getUserMedia({ audio: true, video: false })
        .then(stream => {
          localStream = stream;
        })
        .catch(err => alert('Microphone Error: ' + err.message));

      // Answer incoming calls automatically
      peer.on('call', (call) => {
        call.answer(localStream);
      });
    }

    function startListener() {
      document.getElementById('selection-view').classList.add('hidden');
      document.getElementById('listener-view').classList.remove('hidden');
      
      // Initialize Listener with a random peer ID
      peer = new Peer();
    }

    function connectToMic() {
      const code = document.getElementById('target-id').value.trim();
      if (!code) return alert('Please enter a Mic Code');

      const fullTargetId = 'mic-' + code;
      document.getElementById('status').textContent = 'Connecting...';

      // Unmute/enable web audio engine
      const audio = document.getElementById('audio-player');
      audio.play().catch(() => {});

      // Call the mic (Listener sends an empty media stream offer to request receiver audio)
      const call = peer.call(fullTargetId, new MediaStream());

      call.on('stream', (remoteStream) => {
        document.getElementById('status').textContent = 'Live Audio Connected!';
        audio.srcObject = remoteStream;
        audio.play();
      });

      call.on('error', (err) => {
        document.getElementById('status').textContent = 'Connection failed: ' + err.message;
      });
    }
  </script>
</body>
</html>
