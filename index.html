<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scaledrone WebRTC Audio Streamer</title>

  <!-- Scaledrone SDK -->
  <script type="text/javascript" src="https://cdn.scaledrone.com/scaledrone.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212; color: #ffffff; margin: 0; min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 20px; transition: background 0.2s ease;
    }
    body.mic-active { background: #000000; }
    .container {
      width: min(440px, 100%); background: #1e1e1e; padding: 28px;
      border-radius: 16px; box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45); text-align: center;
    }
    body.mic-active .container { background: #050505; }
    h1, h2 { margin-top: 0; }
    p { color: #b8b8b8; line-height: 1.5; }
    button {
      appearance: none; border: 0; background: #007aff; color: white;
      padding: 13px 18px; font-size: 1rem; font-weight: 700; border-radius: 9px;
      cursor: pointer; margin: 7px 4px; width: calc(100% - 8px);
      transition: transform 0.12s ease, background 0.15s ease;
    }
    button:hover { background: #005ec7; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.55; cursor: default; }
    .device-btn {
      display: block; width: 100%; text-align: left; background: #292929;
      border: 1px solid #444; margin: 8px 0; padding: 14px; border-radius: 9px; color: #fff;
    }
    .device-btn:hover { background: #343434; }
    .device-btn.active { background: #34c759; color: #000; border-color: #34c759; }
    .status { margin-top: 12px; font-size: 0.9rem; color: #9d9d9d; line-height: 1.45; }
    .status.good { color: #34c759; }
    .status.warn { color: #ffcc00; }
    .status.error { color: #ff453a; }
    .hidden { display: none !important; }
    #remoteAudio { width: 100%; margin-top: 16px; border-radius: 8px; }
    .mic-screen { width: min(440px, 100%); text-align: center; }
    .mic-dot {
      width: 90px; height: 90px; margin: 0 auto 20px; border-radius: 50%;
      background: #ff453a; box-shadow: 0 0 0 0 rgba(255, 69, 58, 0.65);
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 69, 58, 0.65); }
      70% { box-shadow: 0 0 0 22px rgba(255, 69, 58, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 69, 58, 0); }
    }
    .log {
      margin-top: 14px; max-height: 150px; overflow: auto; background: #101010;
      border: 1px solid #292929; border-radius: 8px; padding: 9px; text-align: left;
      font-family: monospace; font-size: 0.72rem; color: #aaa; white-space: pre-wrap; word-break: break-word;
    }
  </style>
</head>

<body>

  <!-- Role selection -->
  <div id="selection-view" class="container">
    <h2>Audio Streamer</h2>
    <p>Choose whether this device sends microphone audio or listens to a microphone.</p>
    <button id="mic-mode-btn">🎤 Mic (Transmitter)</button>
    <button id="listener-mode-btn">🔊 Listener (Receiver)</button>
    <div id="startup-status" class="status">Ready.</div>
  </div>

  <!-- Mic view -->
  <div id="mic-view" class="mic-screen hidden">
    <div class="mic-dot"></div>
    <h2>Microphone Active</h2>
    <p id="mic-name">Starting microphone...</p>
    <div id="mic-status" class="status">Requesting permission...</div>
    <div id="mic-log" class="log hidden"></div>
  </div>

  <!-- Listener view -->
  <div id="listener-view" class="container hidden">
    <h2>Available Microphones</h2>
    <p>Select a microphone to listen live.</p>
    <div id="device-list"><div class="status">Connecting...</div></div>
    <div id="connection-status" class="status">Not connected</div>
    <!-- Added 'controls' so users can manually click play if browser auto-play gets blocked -->
    <audio id="remoteAudio" autoplay playsinline controls></audio>
    <div id="listener-log" class="log hidden"></div>
  </div>

  <script>
    "use strict";

    // 1. FILE PROTOCOL CHECK (Crucial for WebRTC)
    if (window.location.protocol === "file:") {
      alert("WARNING: WebRTC Microphone access will fail on a file:// URL. You must run this file on a local web server (like VS Code Live Server) or upload it to a secure HTTPS host.");
    }

    // ============================================================
    // SCALEDRONE & WEBRTC SETTINGS
    // ============================================================
    const CHANNEL_ID = "Sw5scfH0QXEhMUkf"; 
    const ROOM_NAME = "observable-audio-room";

    const RTC_CONFIGURATION = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    };

    // ============================================================
    // APP STATE
    // ============================================================
    let role = null;
    let drone = null;
    let room = null;
    let localStream = null;
    let listenerPC = null;
    let listenerTargetId = null;
    let listenerPendingCandidates = [];
    let micPC = null;
    let micTargetId = null;
    let micPendingCandidates = [];
    let roomMembers = [];

    // Elements
    const selectionView = document.getElementById("selection-view");
    const micView = document.getElementById("mic-view");
    const listenerView = document.getElementById("listener-view");
    const remoteAudio = document.getElementById("remoteAudio");

    function log(msg, error = false) {
      const time = new Date().toLocaleTimeString();
      console.log(`[${time}] ${msg}`);
      const target = role === "mic" ? document.getElementById("mic-log") : document.getElementById("listener-log");
      if (target) {
        target.classList.remove("hidden");
        target.textContent += (target.textContent ? "\n" : "") + `[${time}] ${msg}`;
        target.scrollTop = target.scrollHeight;
      }
    }

    function setStatus(elId, message, type) {
      const el = document.getElementById(elId);
      el.textContent = message;
      el.className = "status";
      if (type) el.classList.add(type);
    }

    // ============================================================
    // INITIALIZATION
    // ============================================================
    document.getElementById("mic-mode-btn").addEventListener("click", function() {
      if (role) return;
      role = "mic";
      selectionView.classList.add("hidden");
      micView.classList.remove("hidden");
      document.body.classList.add("mic-active");
      initMic();
    });

    document.getElementById("listener-mode-btn").addEventListener("click", function() {
      if (role) return;
      role = "listener";
      selectionView.classList.add("hidden");
      listenerView.classList.remove("hidden");
      initDrone({ name: "Listener", type: "listener" });
    });

    // ============================================================
    // SCALEDRONE CONNECTION
    // ============================================================
    function initDrone(userData) {
      if (typeof ScaleDrone === 'undefined') {
        return log("Scaledrone SDK failed to load. Check adblockers.", true);
      }

      drone = new ScaleDrone(CHANNEL_ID, { data: userData });
      drone.on("open", function(error) {
        if (error) return log("Scaledrone connection failed: " + error.message, true);
        log("Scaledrone connected. Joining room...");

        room = drone.subscribe(ROOM_NAME);
        room.on("open", function(roomError) {
          if (roomError) return log("Room join failed: " + roomError.message, true);
          log("Joined " + ROOM_NAME);
          if (role === "mic") setStatus("mic-status", "Waiting for a listener...", "good");
        });

        // Handle signaling messages
        room.on("message", handleSignalingMessage);

        room.on("members", function(members) {
          roomMembers = Array.isArray(members) ? members : [];
          if (role === "listener") renderDeviceList();
        });

        room.on("member_join", function(member) {
          roomMembers.push(member);
          if (role === "listener") renderDeviceList();
        });

        room.on("member_leave", function(member) {
          roomMembers = roomMembers.filter(function(m) { return m.id !== member.id; });
          if (role === "listener" && member.id === listenerTargetId) closeListenerConnection();
          if (role === "mic" && member.id === micTargetId) closeMicConnection();
          if (role === "listener") renderDeviceList();
        });
      });
    }

    // Explicitly add our own senderId to prevent signaling collisions
    function sendMessage(message, targetId) {
      if (!drone || !room) return;
      drone.publish({
        room: ROOM_NAME,
        message: Object.assign({}, message, { target: targetId, senderId: drone.clientId })
      });
    }

    // ============================================================
    // MICROPHONE MODE (TRANSMITTER)
    // ============================================================
    async function initMic() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        const micName = "Mic " + Math.floor(1000 + Math.random() * 9000);
        document.getElementById("mic-name").textContent = micName;
        setStatus("mic-status", "Microphone working. Connecting...", "good");
        
        initDrone({ name: micName, type: "mic" });
      } catch (error) {
        log("Microphone access failed: " + error.message, true);
        setStatus("mic-status", "Microphone permission denied. Use HTTPS.", "error");
      }
    }

    function closeMicConnection() {
      micTargetId = null;
      micPendingCandidates = [];
      if (micPC) { micPC.close(); micPC = null; }
      setStatus("mic-status", "Waiting for another listener...", "good");
    }

    // ============================================================
    // LISTENER MODE (RECEIVER)
    // ============================================================
    function renderDeviceList() {
      const listContainer = document.getElementById("device-list");
      listContainer.innerHTML = "";
      
      const mics = roomMembers.filter(function(m) { return m && m.clientData && m.clientData.type === "mic"; });
      if (mics.length === 0) {
        listContainer.innerHTML = '<div class="status">No active microphones found.</div>';
        return;
      }

      mics.forEach(function(mic) {
        const btn = document.createElement("button");
        btn.className = "device-btn" + (mic.id === listenerTargetId ? " active" : "");
        const micName = mic.clientData.name || "Unnamed Mic";
        btn.textContent = "🎤 " + micName;

        btn.addEventListener("click", function() {
          // 2. IOS AUTOPLAY FIX: Force media unlock strictly inside the click event
          try { remoteAudio.play().catch(function(){}); } catch(e) {}
          connectToMic(mic.id, micName);
        });

        listContainer.appendChild(btn);
      });
    }

    async function connectToMic(targetId, name) {
      closeListenerConnection();
      listenerTargetId = targetId;
      setStatus("connection-status", "Connecting to " + name + "...", "warn");
      
      listenerPC = new RTCPeerConnection(RTC_CONFIGURATION);
      listenerPC.addTransceiver("audio", { direction: "recvonly" });

      listenerPC.onicecandidate = function(event) {
        if (event.candidate) {
          sendMessage({ type: "ice-candidate", candidate: event.candidate }, targetId);
        }
      };

      listenerPC.ontrack = function(event) {
        log("Remote audio track received!");
        remoteAudio.srcObject = (event.streams && event.streams[0]) ? event.streams[0] : new MediaStream([event.track]);
        remoteAudio.play().then(() => {
          setStatus("connection-status", "Streaming live from " + name, "good");
        }).catch(() => {
          setStatus("connection-status", "Stream ready. Tap the audio player below to listen.", "warn");
        });
      };

      try {
        const offer = await listenerPC.createOffer();
        await listenerPC.setLocalDescription(offer);
        sendMessage({ type: "sdp-offer", sdp: listenerPC.localDescription }, targetId);
      } catch (error) {
        log("Failed to create offer: " + error.message, true);
      }
    }

    function closeListenerConnection() {
      listenerTargetId = null;
      listenerPendingCandidates = [];
      if (listenerPC) { listenerPC.close(); listenerPC = null; }
      remoteAudio.srcObject = null;
    }

    // ============================================================
    // SIGNALING / NEGOTIATION
    // ============================================================
    async function handleSignalingMessage(envelope) {
      const message = envelope.data;
      if (!message || typeof message !== "object") return;
      
      // 3. STRICT TARGET VALIDATION: Ignore messages not explicitly addressed to us
      if (!message.target || message.target !== drone.clientId) return;

      const senderId = message.senderId;

      if (role === "mic") {
        if (message.type === "sdp-offer") await handleMicOffer(message.sdp, senderId);
        if (message.type === "ice-candidate") await handleMicIceCandidate(message.candidate);
      } else if (role === "listener") {
        if (message.type === "sdp-answer") await handleListenerAnswer(message.sdp);
        if (message.type === "ice-candidate") await handleListenerIceCandidate(message.candidate);
      }
    }

    async function handleMicOffer(offer, senderId) {
      micTargetId = senderId;
      if (micPC) micPC.close();
      
      micPC = new RTCPeerConnection(RTC_CONFIGURATION);
      
      micPC.onicecandidate = function(event) {
        if (event.candidate) sendMessage({ type: "ice-candidate", candidate: event.candidate }, senderId);
      };

      micPC.onconnectionstatechange = function() {
        if (micPC.connectionState === "connected") setStatus("mic-status", "Streaming audio live.", "good");
        if (micPC.connectionState === "disconnected") closeMicConnection();
      };

      // 4. SAFE TRACK ADDITION
      if (localStream) {
        localStream.getAudioTracks().forEach(function(track) {
          try { micPC.addTrack(track, localStream); } catch(e) { log("Track error: " + e.message, true); }
        });
      }

      try {
        await micPC.setRemoteDescription(new RTCSessionDescription(offer));
        for (const candidate of micPendingCandidates) {
          await micPC.addIceCandidate(new RTCIceCandidate(candidate));
        }
        micPendingCandidates = [];

        const answer = await micPC.createAnswer();
        await micPC.setLocalDescription(answer);
        sendMessage({ type: "sdp-answer", sdp: micPC.localDescription }, senderId);
      } catch (error) {
        log("Negotiation failed: " + error.message, true);
      }
    }

    async function handleListenerAnswer(answer) {
      try {
        await listenerPC.setRemoteDescription(new RTCSessionDescription(answer));
        for (const candidate of listenerPendingCandidates) {
          await listenerPC.addIceCandidate(new RTCIceCandidate(candidate));
        }
        listenerPendingCandidates = [];
      } catch (error) { log("Answer failed: " + error.message, true); }
    }

    async function handleMicIceCandidate(candidate) {
      if (!micPC || !micPC.remoteDescription) { micPendingCandidates.push(candidate); return; }
      try { await micPC.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {}
    }

    async function handleListenerIceCandidate(candidate) {
      if (!listenerPC || !listenerPC.remoteDescription) { listenerPendingCandidates.push(candidate); return; }
      try { await listenerPC.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {}
    }
  </script>
</body>
</html>
