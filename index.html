<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Mic Audio Streamer</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    
    body.mic-active {
      background-color: #000000;
    }

    .container {
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    button {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 5px;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    .device-btn {
      display: block;
      width: 100%;
      background-color: #2a2a2a;
      border: 1px solid #444;
      margin: 8px 0;
      padding: 14px;
      text-align: left;
    }

    .device-btn.active {
      background-color: #34c759;
      color: #000;
      font-weight: bold;
      border-color: #34c759;
    }

    .hidden {
      display: none !important;
    }

    .status {
      font-size: 0.85rem;
      color: #8e8e93;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- Mode Selection -->
  <div id="selection-view" class="container">
    <h2>Select Role</h2>
    <p>Choose whether this device acts as an audio source or a receiver.</p>
    <button onclick="startMic()">Mic (Transmitter)</button>
    <button onclick="startListener()">Listener (Receiver)</button>
  </div>

  <!-- Mic Active View (Goes completely black) -->
  <div id="mic-view" class="hidden"></div>

  <!-- Listener View -->
  <div id="listener-view" class="container hidden">
    <h2>Active Microphones</h2>
    <p>Tap any device to switch streams:</p>
    <div id="device-list">
      <div class="status">Scanning for online mics...</div>
    </div>
    <div id="connection-status" class="status">Not connected</div>
    <audio id="audio-player" autoplay controls style="width: 100%; margin-top: 15px;"></audio>
  </div>

  <script>
    const HUB_ID = 'audio-hub-registry-room-scaledrone-alt';
    let peer = null;
    let localStream = null;
    let currentCall = null;
    let registeredMics = {};

    // --- MIC MODE ---
    async function startMic() {
      document.getElementById('selection-view').classList.add('hidden');
      document.body.classList.add('mic-active');
      document.getElementById('mic-view').classList.remove('hidden');

      try {
        // Capture high-quality mic input
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

        const micId = 'mic-' + Math.floor(1000 + Math.random() * 9000);
        const deviceName = `Microphone ${micId.replace('mic-', '')}`;
        peer = new Peer(micId);

        // Announce presence to the Hub/Listener network when connected
        peer.on('open', () => {
          const hubConn = peer.connect(HUB_ID);
          hubConn.on('open', () => {
            hubConn.send({ type: 'register', id: micId, name: deviceName });
          });
        });

        // Answer incoming calls automatically from any switching listener
        peer.on('call', (call) => {
          call.answer(localStream);
        });

      } catch (err) {
        alert('Microphone access denied or unassigned: ' + err.message);
      }
    }

    // --- LISTENER MODE ---
    function startListener() {
      document.getElementById('selection-view').classList.add('hidden');
      document.getElementById('listener-view').classList.remove('hidden');

      // The listener registers as the "Hub" to collect active mic IDs
      peer = new Peer(HUB_ID);

      peer.on('open', () => {
        document.getElementById('connection-status').textContent = 'Listening for live mics...';
      });

      // Handle cases where the Hub ID is already occupied by another listener instance
      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          peer = new Peer(); // Fallback to random ID
        }
      });

      // Listen for incoming registrations from Mics
      peer.on('connection', (conn) => {
        conn.on('data', (data) => {
          if (data.type === 'register') {
            registeredMics[data.id] = data.name;
            renderDeviceList();
          }
        });
      });
    }

    // Dynamic UI builder for switching mics
    function renderDeviceList() {
      const listContainer = document.getElementById('device-list');
      listContainer.innerHTML = '';

      const micIds = Object.keys(registeredMics);

      if (micIds.length === 0) {
        listContainer.innerHTML = '<div class="status">No active microphones found.</div>';
        return;
      }

      micIds.forEach(id => {
        const btn = document.createElement('button');
        btn.className = 'device-btn';
        btn.id = `btn-${id}`;
        btn.textContent = `🎤 ${registeredMics[id]}`;
        btn.onclick = () => switchStreamTo(id);
        listContainer.appendChild(btn);
      });
    }

    // --- STREAM SWITCHING ENGINE ---
    function switchStreamTo(targetMicId) {
      // 1. Close current audio connection if one exists
      if (currentCall) {
        currentCall.close();
      }

      // Highlight active button in UI
      document.querySelectorAll('.device-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${targetMicId}`);
      if (activeBtn) activeBtn.classList.add('active');

      document.getElementById('connection-status').textContent = `Connecting to ${registeredMics[targetMicId]}...`;

      // 2. Unlock HTML5 web audio context
      const audioElement = document.getElementById('audio-player');
      audioElement.play().catch(() => {});

      // 3. Initiate new audio stream call to selected mic
      currentCall = peer.call(targetMicId, new MediaStream());

      currentCall.on('stream', (remoteStream) => {
        document.getElementById('connection-status').textContent = `Now playing: ${registeredMics[targetMicId]}`;
        audioElement.srcObject = remoteStream;
        audioElement.play();
      });

      currentCall.on('error', (err) => {
        document.getElementById('connection-status').textContent = `Failed to connect: ${err.message}`;
      });
    }
  </script>
</body>
</html>
